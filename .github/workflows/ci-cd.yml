  #       run: npm run build

  # ==========================================
  # BACKEND BUILD, PUSH, SCAN AND DEPLOY
  # ==========================================

  publish-scan-deploy:
    name: Build, push, scan and deploy Backend
    runs-on: ubuntu-latest

    needs: [backend-ci]

    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ticket-booking-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ticket-booking-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ticket-booking-backend:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Deploy backend image to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_BACKEND_DEPLOY_HOOK is not set; skipping initial Render deploy."
            exit 0
          fi

          curl --fail --show-error --silent --get \
            --data-urlencode "imgURL=docker.io/${DOCKERHUB_USERNAME}/ticket-booking-backend:${IMAGE_TAG}" \
            "$RENDER_DEPLOY_HOOK"

