
services:
  # ==========================================
  # BACKEND
  # ==========================================

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: ticket_booking_backend
    restart: unless-stopped
    expose:
      - "1323"
    env_file:
      - ./backend/.env
    networks:
      - app_network

