
services:
  # ==========================================
  # BACKEND
  # ==========================================

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: ticket_booking_backend
    restart: unless-stopped
    expose:
      - "1323"
    env_file:
      - ./backend/.env
    networks:
      - app_network

  # ==========================================
  # FRONTEND
  # ==========================================

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    container_name: ticket_booking_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend
    networks:
      - app_network

  # ==========================================
  # NGINX (DISABLED - ./nginx/default.conf not present)
  # ==========================================

  # nginx:
  #   image: nginx:alpine
  #   container_name: ticket_nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     - backend
  #   networks:
  #     - app_network

networks:
  app_network:
    driver: bridge
